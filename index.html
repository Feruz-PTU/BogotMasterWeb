<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- 96 px (5 KB): the tab shows it at 16-32 px. It was the 26 KB 904 px logo. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/Logo/favicon-96.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bogot Master</title>

    <!-- Fonts: Poppins is self-hosted in public/fonts (rules in src/index.css).
         Loading it from Google Fonts held back the first paint by about 650 ms
         on mobile, waiting on two extra servers. These two preloads are the
         weights almost every page shows; the others load only when used. -->
    <link rel="preload" href="/fonts/poppins-v24-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-v24-latin-600.woff2" as="font" type="font/woff2" crossorigin />

    <!-- The hero image preload lives on the home page only (injected per route),
         not here. In the old setup every route — /about, /contact, /admin —
         downloaded 164 KB of hero image it never displayed. -->
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
